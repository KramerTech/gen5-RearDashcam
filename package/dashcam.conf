# Recorder settings, passed to it as --key=value arguments. Defaults in comments: they're what's
# been tested, so change them only to experiment.
#   --out=/storage/usb0/Dashcam    where segments go
#   --mount=/storage/usb0          recording waits until this is mounted
#   --fps=20                       frames per second kept from the camera's 60 (sets the CPU load)
#   --bitrate=3000000              H.264 bitrate, bits per second (3 Mbit/s is about 1.35 GB an hour)
#   --segment=60                   seconds per file
#   --min-free-percent=5           oldest files are deleted to keep this share of the drive free
#   --width=720 --height=480       recording size; the camera hardware scales its picture to it
#   --mirror=true                  flip left to right (the backup camera sends a mirror image)
#   --swap-uv=false                set true if recordings have red and blue swapped
#   --save-button=auto:37          key device and code that saves when pressed 4 times quickly
#                                  (the steering wheel's mute); auto is the head unit's own,
#                                  daudio_<model>; empty turns it off
#   --save-seconds=120             how much the button saves
#   --hide-guide-lines=true        turn the camera's parking guide lines off while recording
DASHCAM_ARGS=""
